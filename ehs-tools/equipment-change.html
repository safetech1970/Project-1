<!doctype html><html><head><script>/* EHS AI bridge: lets tools that use Claude's in-app AI run on a normal website
   with the user's own Anthropic API key. Does nothing inside Claude. */
(function(){
  if (window.claude) return;
  var KEY='ehsAiKey', TIER='ehsAiTier';
  var MODELS={quick:'claude-haiku-5-5','default':'claude-sonnet-5-5',complex:'claude-opus-5-5'};
  function ls(k,v){try{if(v===undefined)return localStorage.getItem(k)||'';if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return ''}}
  function es(){return (document.documentElement.lang||'').slice(0,2)==='es'}
  function T(en,sp){return es()?sp:en}
  function err(code,message,text){var e={code:code,message:message};if(text)e.text=text;return e}

  function toB64(blob){return new Promise(function(res,rej){
    var url=URL.createObjectURL(blob),img=new Image();
    img.onload=function(){var m=1568,s=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));
      var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
      res({type:'image',source:{type:'base64',media_type:'image/jpeg',data:c.toDataURL('image/jpeg',.85).split(',')[1]}})};
    img.onerror=function(){URL.revokeObjectURL(url);rej(err('image_rejected','Could not read image'))};img.src=url})}

  function normMsgs(input){
    if(typeof input==='string'){if(!input.trim())throw err('invalid_request','Empty input');return [{role:'user',content:input}]}
    if(!Array.isArray(input)||!input.length)throw err('invalid_request','Input must be a string or turns');
    var out=[];input.forEach(function(m){var r=m.role==='assistant'?'assistant':'user';
      if(out.length&&out[out.length-1].role===r)out[out.length-1].content+='\n\n'+m.content;else out.push({role:r,content:String(m.content)})});
    if(out[0].role!=='user'||out[out.length-1].role!=='user')throw err('invalid_request','Turns must start and end with user');
    return out}

  async function post(body,signal){
    var k=ls(KEY);
    if(!k){openPanel(true);throw err('upstream_error',T('Add your Anthropic API key (AI button) to use AI on this site.','Agregue su clave de API de Anthropic (botón IA) para usar la IA en este sitio.'))}
    var r;
    try{r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:signal,headers:{'content-type':'application/json','x-api-key':k,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)})}
    catch(e){if(signal&&signal.aborted)throw err('cancelled','Cancelled');throw err('upstream_error',T('No connection to the AI service.','Sin conexión con el servicio de IA.'))}
    if(!r.ok){var msg='';try{msg=(await r.json()).error.message}catch(e){}
      if(r.status===401||r.status===403){openPanel(true);throw err('upstream_error',T('The API key was not accepted. Check it in the AI button.','La clave de API no fue aceptada. Revísela en el botón IA.'))}
      if(r.status===429)throw err('rate_limited',msg||'Rate limited');
      if(r.status===400&&/credit|billing/i.test(msg))throw err('upstream_error',T('Your API account is out of credit.','Su cuenta de API no tiene crédito.'));
      if(r.status===400)throw err('invalid_request',msg||'Bad request');
      throw err('upstream_error',msg||('HTTP '+r.status))}
    return r.json()}

  async function sample(input,opts){
    opts=opts||{};
    if(opts.signal&&opts.signal.aborted)throw err('cancelled','Cancelled');
    var msgs=normMsgs(input),tier=opts.modelTier&&MODELS[opts.modelTier]?opts.modelTier:(ls(TIER)||'default');
    var model=(opts.model&&/^claude-/.test(opts.model))?opts.model:MODELS[tier]||MODELS['default'];
    if(opts.images){var list=opts.images instanceof Blob?[opts.images]:Array.prototype.slice.call(opts.images);
      if(list.length){var blocks=[];for(var i=0;i<list.length;i++)blocks.push(await toB64(list[i]));
        var last=msgs[msgs.length-1];last.content=blocks.concat([{type:'text',text:last.content}])}}
    var tools=(opts.tools||[]).map(function(t){return{name:t.name,description:t.description,input_schema:t.inputSchema||{type:'object',properties:{}}}});
    var all='',truncated=false,rounds=0;
    while(true){
      var body={model:model,max_tokens:8192,messages:msgs};if(tools.length)body.tools=tools;
      var j=await post(body,opts.signal);rounds++;
      var txt=(j.content||[]).filter(function(b){return b.type==='text'}).map(function(b){return b.text}).join('');
      if(txt.trim())all=all?all+'\n\n'+txt:txt;
      truncated=j.stop_reason==='max_tokens';
      var uses=(j.content||[]).filter(function(b){return b.type==='tool_use'});
      if(j.stop_reason!=='tool_use'||!uses.length||rounds>=6)break;
      msgs.push({role:'assistant',content:j.content});
      var results=await Promise.all(uses.map(async function(u){var t=(opts.tools||[]).filter(function(x){return x.name===u.name})[0];
        try{var v=await t.execute(u.input||{},{signal:opts.signal||new AbortController().signal});return{type:'tool_result',tool_use_id:u.id,content:typeof v==='string'?v:JSON.stringify(v==null?'':v)}}
        catch(e){return{type:'tool_result',tool_use_id:u.id,content:'Error: '+(e&&e.message||e),is_error:true}}}));
      msgs.push({role:'user',content:results})}
    if(!all.trim())throw err('empty_completion','No text');
    if(opts.onText){try{opts.onText({text:all,delta:all})}catch(e){}}
    var out={text:all,truncated:truncated,modelTierApplied:tier};if(opts.model&&model===opts.model)out.modelApplied=model;return out}

  function parseJSON(t){
    try{return JSON.parse(t)}catch(e){}
    var f=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(f){try{return JSON.parse(f[1])}catch(e){}}
    var a=t.search(/[\[{]/),b=Math.max(t.lastIndexOf('}'),t.lastIndexOf(']'));
    if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1))}catch(e){}}
    throw err('invalid_json','Reply was not JSON',t)}
  sample.json=async function(input,opts){
    var add='\n\nYour reply will be machine-parsed: reply with only the JSON value, no other text.';
    var inp=typeof input==='string'?input+add:input.map(function(m,i){return i===input.length-1?{role:m.role,content:m.content+add}:m});
    var r=await sample(inp,opts);if(r.truncated)throw err('invalid_json','Reply was cut short',r.text);return parseJSON(r.text)};
  sample.limits=async function(){return{maxPromptBytes:262144,images:{maxCount:20,maxInputBytes:20000000,mediaTypes:['image/jpeg','image/png','image/webp','image/gif']},tools:{maxCount:20},modelTiers:['default','complex','quick']}};

  window.claude={use:function(name){return Promise.resolve(name==='sample'?sample:null)}};

  /* ---- AI key panel ---- */
  var panel,btn;
  function css(){var s=document.createElement('style');s.textContent=
    '#ehsAiBtn{position:fixed;left:max(12px,env(safe-area-inset-left));bottom:calc(68px + env(safe-area-inset-bottom));z-index:2147483000;background:#0f2942;color:#fff;border:2px solid #f2b705;border-radius:20px;padding:7px 12px;font:700 13px -apple-system,Segoe UI,Arial,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.25)}'+
    '#ehsAiBtn.off{background:#5b6b7c;border-color:#c9d2dc}'+
    '#ehsAiPanel{position:fixed;inset:0;background:rgba(15,41,66,.55);z-index:2147483001;display:none;align-items:center;justify-content:center;padding:16px;font:15px -apple-system,Segoe UI,Arial,sans-serif;color:#1c2733}'+
    '#ehsAiPanel.on{display:flex}#ehsAiPanel .bx{background:#fff;border-radius:14px;max-width:440px;width:100%;padding:18px;border-top:5px solid #d9531e}'+
    '#ehsAiPanel h3{margin:0 0 8px;color:#0f2942;font-size:17px}#ehsAiPanel p{margin:6px 0;font-size:13px;color:#5b6b7c;line-height:1.45}'+
    '#ehsAiPanel input,#ehsAiPanel select{width:100%;box-sizing:border-box;font-size:16px;padding:10px;border:1px solid #d8dee6;border-radius:8px;margin:6px 0}'+
    '#ehsAiPanel .r{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}#ehsAiPanel button{border:0;border-radius:8px;padding:10px 14px;font-weight:700;font-size:14px}'+
    '#ehsAiPanel .p{background:#d9531e;color:#fff}#ehsAiPanel .g{background:#e9edf2;color:#0f2942}#ehsAiPanel .x{background:#fbe9e7;color:#c0392b}#ehsAiPanel .st{font-weight:700;font-size:13px;margin-top:8px}';
    document.head.appendChild(s)}
  function refresh(){if(!btn)return;var on=!!ls(KEY);btn.className=on?'':'off';btn.textContent=on?T('✨ AI on','✨ IA activa'):T('✨ Set up AI','✨ Activar IA')}
  function openPanel(reason){if(!panel)return;panel.querySelector('#ehsAiKeyIn').value='';panel.querySelector('#ehsAiTierIn').value=ls(TIER)||'default';
    panel.querySelector('.st').textContent=ls(KEY)?T('A key is saved on this device.','Hay una clave guardada en este dispositivo.'):(reason?T('AI needs an API key on this site.','La IA necesita una clave de API en este sitio.'):'');
    panel.classList.add('on')}
  function build(){css();
    btn=document.createElement('button');btn.id='ehsAiBtn';btn.type='button';btn.onclick=function(){openPanel(false)};document.body.appendChild(btn);
    panel=document.createElement('div');panel.id='ehsAiPanel';
    panel.innerHTML='<div class="bx"><h3></h3><p class="d1"></p><p class="d2"></p><input id="ehsAiKeyIn" type="password" autocomplete="off" placeholder="sk-ant-…">'+
      '<select id="ehsAiTierIn"><option value="default"></option><option value="quick"></option><option value="complex"></option></select>'+
      '<div class="st"></div><div class="r"><button class="p" data-a="save"></button><button class="g" data-a="test"></button><button class="x" data-a="del"></button><button class="g" data-a="close"></button></div></div>';
    document.body.appendChild(panel);
    function labels(){panel.querySelector('h3').textContent=T('AI on this site','IA en este sitio');
      panel.querySelector('.d1').textContent=T('Paste your Anthropic API key (console.anthropic.com → API Keys). It is saved only in this browser on this device and shared by all tools on this site. Usage is billed to your API account.','Pegue su clave de API de Anthropic (console.anthropic.com → API Keys). Se guarda solo en este navegador de este dispositivo y la comparten todas las herramientas del sitio. El uso se cobra a su cuenta de API.');
      panel.querySelector('.d2').textContent=T('Do not save a key on shared team devices.','No guarde una clave en dispositivos compartidos del equipo.');
      var o=panel.querySelectorAll('option');o[0].textContent=T('Standard (Sonnet) — recommended','Estándar (Sonnet) — recomendado');o[1].textContent=T('Fast & cheapest (Haiku)','Rápido y económico (Haiku)');o[2].textContent=T('Most capable (Opus)','Más capaz (Opus)');
      var b=panel.querySelectorAll('button');b[0].textContent=T('Save','Guardar');b[1].textContent=T('Test','Probar');b[2].textContent=T('Remove key','Quitar clave');b[3].textContent=T('Close','Cerrar')}
    labels();refresh();
    panel.addEventListener('click',async function(e){var a=e.target.getAttribute&&e.target.getAttribute('data-a'),st=panel.querySelector('.st');
      if(e.target===panel||a==='close'){panel.classList.remove('on');return}
      if(a==='save'){var v=panel.querySelector('#ehsAiKeyIn').value.trim();if(v)ls(KEY,v);ls(TIER,panel.querySelector('#ehsAiTierIn').value);st.textContent=ls(KEY)?T('Saved.','Guardado.'):T('Paste a key first.','Pegue una clave primero.');refresh()}
      if(a==='del'){ls(KEY,null);st.textContent=T('Key removed from this device.','Clave eliminada de este dispositivo.');refresh()}
      if(a==='test'){var v2=panel.querySelector('#ehsAiKeyIn').value.trim();if(v2)ls(KEY,v2);refresh();st.textContent=T('Testing…','Probando…');
        try{await sample('Reply with only the word OK.',{modelTier:'quick'});st.textContent=T('✓ Working. AI is ready.','✓ Funciona. La IA está lista.')}catch(x){st.textContent='✕ '+(x&&x.message||x)}}});
    new MutationObserver(function(){labels();refresh()}).observe(document.documentElement,{attributes:true,attributeFilter:['lang']})}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',build);else build();
})();
</script><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0f2942"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="EHS Tools"><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Equipment Change Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: navy header band + sticky step bar; single working column (max 1040px) of form panels, summary strip on top. */
:root{
  --navy:#0f2942; --orange:#d9531e; --yellow:#f2b705;
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f6f8fb; --ink:#14202e; --muted:#566476; --line:#d6dde6;
  --head:#0f2942; --head-ink:#ffffff; --head-muted:#a9bcd1;
  --accent:#d9531e; --accent-ink:#ffffff; --accent-soft:#fbe7de;
  --ok:#1d7f47; --ok-soft:#dff2e6; --bad:#b8322a; --bad-soft:#f9e0de; --warn:#9a6a00; --warn-soft:#fdf1cf;
  --r1:#2f8f55; --r2:#c49a0a; --r3:#d9781e; --r4:#c8402b; --r5:#7e1d1d;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1520; --surface:#112131; --surface-2:#0d1b29; --ink:#e4ebf2; --muted:#93a4b7; --line:#23384d;
  --head:#081a2c; --head-ink:#ffffff; --head-muted:#8fa6bf;
  --accent:#ee6c34; --accent-ink:#1a0a03; --accent-soft:#3a1d10;
  --ok:#4cc27e; --ok-soft:#12301f; --bad:#f07468; --bad-soft:#3a1714; --warn:#f2c341; --warn-soft:#33290c;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1520; --surface:#112131; --surface-2:#0d1b29; --ink:#e4ebf2; --muted:#93a4b7; --line:#23384d;
  --head:#081a2c; --head-ink:#ffffff; --head-muted:#8fa6bf;
  --accent:#ee6c34; --accent-ink:#1a0a03; --accent-soft:#3a1d10;
  --ok:#4cc27e; --ok-soft:#12301f; --bad:#f07468; --bad-soft:#3a1714; --warn:#f2c341; --warn-soft:#33290c;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{max-width:1040px;margin:0 auto}

/* header */
.top{background:var(--head);color:var(--head-ink)}
.top .in{display:flex;align-items:center;gap:14px;padding-block:14px;flex-wrap:wrap}
.mark{width:40px;height:40px;flex:none;border-radius:6px;background:var(--orange);display:grid;place-items:center}
.mark svg{width:24px;height:24px}
.brand{min-width:0;flex:1}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:1.65rem;letter-spacing:.02em;margin:0;line-height:1.05;text-transform:uppercase}
.brand p{margin:2px 0 0;color:var(--head-muted);font-size:.86rem}
.top-actions{display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,.28);border-radius:6px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--head-ink);padding:6px 10px;font-weight:700;font-size:.82rem;cursor:pointer;letter-spacing:.06em}
.seg button[aria-pressed="true"]{background:var(--yellow);color:#0f2942}
.hbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);color:var(--head-ink);border-radius:6px;padding:6px 12px;font-weight:600;cursor:pointer}
.hbtn:hover{background:rgba(255,255,255,.18)}

/* steps */
.steps{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--head);border-top:1px solid rgba(255,255,255,.08)}
.steps-scroll{overflow-x:auto;scrollbar-width:none}
.steps-scroll::-webkit-scrollbar{display:none}
.steps .row{display:flex;gap:2px;min-width:max-content}
.step{background:transparent;border:0;color:var(--head-muted);padding:10px 14px 9px;cursor:pointer;display:flex;align-items:baseline;gap:8px;border-bottom:3px solid transparent;font-weight:600;white-space:nowrap}
.step b{font-family:var(--f-mono);font-size:.74rem;color:var(--yellow);font-weight:500}
.step[aria-selected="true"]{color:var(--head-ink);border-bottom-color:var(--orange)}
.step:hover{color:var(--head-ink)}

main{padding-block:18px 60px}
main .in{display:flex;flex-direction:column;gap:16px}
#panel{display:flex;flex-direction:column;gap:16px}
.decisions.modes{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:640px){.decisions.modes{grid-template-columns:1fr}}
.dec.mode[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.lbl{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.rca{display:flex;flex-direction:column;gap:14px}
.rca-root{background:var(--accent-soft);border-radius:8px;padding:12px 16px}
.rca-root p{margin:4px 0 0;font-size:1.05rem;font-weight:600;max-width:72ch}
.whys{list-style:none;margin:8px 0 0;padding:0}
.whys li{display:grid;grid-template-columns:76px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:baseline}
.whys li:last-child{border-bottom:0}
.whys .mono{color:var(--accent)}
.factors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:8px}
@media (max-width:760px){.factors{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.factors{grid-template-columns:1fr}}
.fac{border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.fac ul{margin:4px 0 0;padding-left:18px}

/* banner */
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);border-radius:8px;padding:10px 14px;font-size:.92rem}
.banner span{flex:1;min-width:220px}

/* summary strip */
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sum{padding:12px 16px;border-right:1px solid var(--line);min-width:0}
.sum:last-child{border-right:0}
.sum .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.sum .v{font-family:var(--f-display);font-size:1.35rem;font-weight:700;line-height:1.2;margin-top:2px;overflow-wrap:anywhere}
.sum .s{font-size:.82rem;color:var(--muted)}
@media (max-width:720px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.sum:nth-child(2){border-right:0}.sum:nth-child(-n+2){border-bottom:1px solid var(--line)}}

.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-family:var(--f-body);font-size:.8rem;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.mute{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.risk{display:inline-flex;align-items:center;justify-content:center;min-width:2.4em;padding:2px 8px;border-radius:5px;color:#fff;font-family:var(--f-mono);font-size:.8rem;font-weight:500}
.rb1{background:var(--r1)}.rb2{background:var(--r2)}.rb3{background:var(--r3)}.rb4{background:var(--r4)}.rb5{background:var(--r5)}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:18px;min-width:0}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph h2{font-family:var(--f-display);font-size:1.5rem;font-weight:700;margin:0;letter-spacing:.01em;text-wrap:balance}
.ph p{margin:2px 0 0;color:var(--muted);max-width:65ch}
h3{font-family:var(--f-display);font-size:1.15rem;font-weight:700;margin:0;letter-spacing:.02em;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid .full{grid-column:1/-1}
@media (max-width:640px){.grid{grid-template-columns:1fr}}

 ${all.length?all.map(r=>`<div class="rv"><span class="pill ${r.mode==="incident"?"warn":r.mode==="annual"?"ok":"mute"}" style="align-self:flex-start">${esc(r.mode==="incident"?t("mInc"):r.mode==="annual"?t("mAnn"):t("mPssr"))}</span><strong>${esc(r.project.equipment||t("untitled"))}</strong><span class="note">${esc(r.project.facility||"")} · ${esc(r.project.line||"")} · ${esc(r.project.date||"")}</span>
 ${pendingDel===r.id?`<div class="btns"><span class="err">${esc(t("confirmDel"))}</span><button class="btn small" data-delyes="${r.id}">${esc(t("yes"))}</button><button class="btn small" data-act="delno">${esc(t("no"))}</button></div>`:`<div class="btns"><button class="btn small primary" data-openr="${r.id}">${esc(t("openR"))}</button><button class="btn small" data-delr="${r.id}">${esc(t("del"))}</button></div>`}</div>`).join(""):`<div class="empty">${esc(t("noSaved"))}</div>`}`}
function openReview(r){S=upgrade(r);aiErr="";askText="";askErr="";tab=0;store.set(LAST,S.id);$("#drawer").hidden=true;renderChrome()}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
 const b=e.target.closest("button,[data-act]");if(!b)return;const d=b.dataset;
 if(d.tab!==undefined){tab=+d.tab;renderChrome();window.scrollTo({top:0});return}
 if(d.goto!==undefined){tab=+d.goto;renderChrome();window.scrollTo({top:0});return}
 if(b.id==="lgEN"||b.id==="lgES"){lang=b.id==="lgES"?"es":"en";store.set(LANG,lang);renderChrome();return}
 if(b.id==="openDrawer"){pendingDel=null;renderDrawer();$("#drawer").hidden=false;return}
 if(d.mode){detach();S.mode=d.mode==="incident"||d.mode==="annual"?d.mode:"pssr";save();renderChrome();return}
 if(d.multi){detach();const a=S.profile[d.multi],i=a.indexOf(d.val);i<0?a.push(d.val):a.splice(i,1);const on=i<0;b.setAttribute("aria-pressed",on);b.querySelector(".tick").textContent=on?"✓":"";save();renderSummary();return}
 if(d.rmphoto!==undefined){S.photos.splice(+d.rmphoto,1);save();renderPanel();return}
 if(d.allpass){detach();const sc=sections().find(x=>x.id===d.allpass);if(sc)sc.items.forEach(i=>{const c=S.checklist[i[0]]||(S.checklist[i[0]]={});if(!c.status)c.status="pass"});save();renderSummary();renderPanel();return}
 if(d.rmdoc){detach();S.docs=(S.docs||[]).filter(x=>x.id!==d.rmdoc);save();renderPanel();return}
 if(d.ck){detach();const id=d.ck,st=d.st,x=S.extra.find(z=>z.id===id);if(x){x.status=x.status===st?"":st}else{const c=S.checklist[id]||(S.checklist[id]={});c.status=c.status===st?"":st}save();renderSummary();const row=b.closest(".ck"),cur=x?x.status:S.checklist[id].status;row.classList.toggle("fail",cur==="fail");row.querySelectorAll(".tri button").forEach(z=>z.setAttribute("aria-pressed",z.dataset.st===cur));const sec=row.closest(".sec");if(sec){const n=sec.querySelectorAll(".tri button[aria-pressed=true]").length,tot=sec.querySelectorAll(".tri").length,m=sec.querySelector(".sec-h .mono");if(m)m.textContent=n+"/"+tot}return}
 if(d.dec){detach();S.signoff.decision=S.signoff.decision===d.dec?"":d.dec;save();renderSummary();document.querySelectorAll("[data-dec]").forEach(z=>z.setAttribute("aria-pressed",z.dataset.dec===S.signoff.decision));return}
 if(d.rmact!==undefined){S.actions.splice(+d.rmact,1);save();renderSummary();renderPanel();return}
 if(d.clrsig!==undefined){S.signoff.sigs[+d.clrsig].img="";save();renderPanel();return}
 if(d.openr){const r=loadAll()[d.openr];if(r)openReview(r);return}
 if(d.delr){pendingDel=d.delr;renderDrawer();return}
 if(d.delyes){const all=loadAll();delete all[d.delyes];store.set(KEY,JSON.stringify(all));if(S.id===d.delyes){S=example();store.del(LAST);renderChrome()}pendingDel=null;renderDrawer();return}
 switch(d.act){
  case"new":S=blank(S.example?S.mode:"pssr");tab=0;save(true);$("#drawer").hidden=true;renderChrome();break;
  case"addphoto":$("#photoInput").click();break;
  case"adddoc":$("#docInput").click();break;
  case"runai":runAI();break;
  case"stopai":aiCtl&&aiCtl.abort();break;
  case"hz2act":if(S.ai){detach();const have=new Set(S.actions.map(a=>a.text));S.ai.hazards.forEach(h=>{const c=h.controls[0];if(c&&!have.has(c.action))S.actions.push({id:uid(),text:c.action,owner:"",due:"",status:"open"})});save();renderSummary();toast(t("added"))}break;
  case"fail2act":{detach();const have=new Set(S.actions.map(a=>a.text));sections().forEach(s=>s.items.forEach(i=>{const c=S.checklist[i[0]];const txt=(lang==="es"?i[2]:i[1])+(c&&c.note?" — "+c.note:"");if(c&&c.status==="fail"&&!have.has(txt))S.actions.push({id:uid(),text:txt,owner:"",due:"",status:"open"})}));S.extra.forEach(x=>{const txt=x.text+(x.note?" — "+x.note:"");if(x.status==="fail"&&!have.has(txt))S.actions.push({id:uid(),text:txt,owner:"",due:"",status:"open"})});save();renderSummary();toast(t("added"));break}
  case"addact":detach();S.actions.push({id:uid(),text:"",owner:"",due:"",status:"open"});save();renderSummary();renderPanel();break;
  case"pdf":exportReport("pdf");break;
  case"docx":exportReport("docx");break;
  case"csv":saveFile(fname("csv"),csv());break;
  case"json":saveFile(fname("json"),JSON.stringify(S,null,1));break;
  case"copy":copyText(summaryText());break;
  case"closedrawer":$("#drawer").hidden=true;break;
  case"exP":openReview(example());break;
  case"exI":openReview(exampleInc());break;
  case"import":$("#importInput").click();break;
  case"delno":pendingDel=null;renderDrawer();break;
 }});
$("#drawer").addEventListener("click",e=>{if(e.target.id==="drawer")$("#drawer").hidden=true});
document.addEventListener("input",e=>{const el=e.target,d=el.dataset;
 if(d.bind){detach();set(d.bind,el.value);save();if(d.bind.startsWith("project.")||d.bind==="profile.notes"||d.bind.startsWith("incident."))renderSummary();return}
 if(d.rs){research[d.rs]=el.checked;store.set(RS_KEY,JSON.stringify(research));return}
 if(d.cknote){detach();const x=S.extra.find(z=>z.id===d.cknote);if(x)x.note=el.value;else{(S.checklist[d.cknote]||(S.checklist[d.cknote]={})).note=el.value}save();return}
 if(d.actf){detach();const[i,k]=d.actf.split(".");S.actions[+i][k]=el.value;save();if(k==="status")renderSummary();return}
 if(d.sign!==undefined){detach();S.signoff.sigs[+d.sign].name=el.value;save();return}});
document.addEventListener("change",e=>{const el=e.target;if(el.dataset.actf&&el.tagName==="SELECT"){renderSummary()}});
document.addEventListener("submit",e=>{e.preventDefault();
 if(e.target.id==="askForm"){const v=$("#askIn").value;ask(v)}
 if(e.target.id==="addItemForm"){const v=$("#addItemIn").value.trim();if(v){detach();S.extra.push({id:"x"+uid(),text:v,cite:"",src:"user",status:"",note:""});save();renderSummary();renderPanel();const n=$("#addItemIn");n&&n.focus()}}});
$("#photoInput").addEventListener("change",e=>{addPhotos(e.target.files);e.target.value=""});
$("#docInput").addEventListener("change",e=>{addDocs(e.target.files);e.target.value=""});
$("#importInput").addEventListener("change",e=>{const f=e.target.files[0];e.target.value="";if(!f)return;const fr=new FileReader();fr.onload=()=>{try{const r=JSON.parse(fr.result);if(!r||!r.project)throw 0;const base=blank();const m=Object.assign(base,r,{example:false});m.id=r.id&&r.id!=="example"?r.id:"r"+uid();S=m;save(true);openReview(S)}catch(_){toast(T[lang].errCopy.default)}};fr.readAsText(f)});
window.addEventListener("resize",()=>{if(tab===3){clearTimeout(window._rz);window._rz=setTimeout(initPads,200)}});

renderChrome();
})();
</script>
