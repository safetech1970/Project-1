<!DOCTYPE html>
<html lang="en">
<head><link rel="manifest" href="../manifest.webmanifest"><meta name="theme-color" content="#0f2942"><link rel="apple-touch-icon" href="../icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="EHS Tools">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Training Certificates &amp; ID Cards — EHS</title>
<style>
:root{--navy:#0f2942;--orange:#d9531e;--yellow:#f2b705;--bg:#f3f5f8;--line:#d8dee6;--muted:#5b6b7c;--ok:#1f8a4c;--warn:#c98a00;--bad:#c0392b}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:#1c2733;-webkit-text-size-adjust:100%}
header{background:var(--navy);color:#fff;padding:12px 16px calc(12px) ;padding-top:calc(12px + env(safe-area-inset-top));position:sticky;top:0;z-index:20;border-bottom:4px solid var(--orange)}
.hrow{display:flex;align-items:center;gap:12px;max-width:1200px;margin:0 auto}
.hlogo{width:40px;height:40px;border-radius:8px;background:var(--orange);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;flex:none;border:2px solid var(--yellow)}
.htitle{flex:1;min-width:0}
.htitle h1{font-size:17px;margin:0;line-height:1.2}
.htitle div{font-size:12px;color:#c9d6e3}
.langbtn{background:var(--yellow);color:var(--navy);border:0;border-radius:20px;padding:8px 14px;font-weight:800;font-size:14px}
nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:68px;z-index:15;overflow-x:auto;white-space:nowrap}
nav .in{max-width:1200px;margin:0 auto;display:flex}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:12px 16px;font-size:14px;font-weight:600;color:var(--muted)}
nav button.on{color:var(--navy);border-bottom-color:var(--orange)}
main{max-width:1200px;margin:0 auto;padding:16px}
.tab{display:none}.tab.on{display:block}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.card h2{font-size:16px;margin:0 0 12px;color:var(--navy);display:flex;align-items:center;gap:8px}
.card h2:before{content:"";width:6px;height:18px;background:var(--orange);border-radius:3px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em}
input,select,textarea{width:100%;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:#1c2733;font-family:inherit}
textarea{min-height:110px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--yellow);border-color:var(--navy)}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:8px;padding:11px 16px;font-size:15px;font-weight:700;background:var(--navy);color:#fff;cursor:pointer}
.btn.o{background:var(--orange)}.btn.y{background:var(--yellow);color:var(--navy)}.btn.g{background:#e9edf2;color:var(--navy)}.btn.r{background:#fbe9e7;color:var(--bad)}
.btn.sm{padding:7px 10px;font-size:13px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mt{margin-top:12px}
.sig{border:2px dashed var(--line);border-radius:8px;background:#fff;width:100%;height:130px;touch-action:none;display:block}
.tlist{max-height:330px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.titem{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid #eef1f5}
.titem:last-child{border-bottom:0}
.titem input{width:22px;height:22px;flex:none}
.titem .nm{font-weight:700}.titem .sub{font-size:12px;color:var(--muted)}
.av{width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none;object-fit:cover}
.prev{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:900px){.prev{grid-template-columns:2fr 1fr}}
.prev canvas{width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff;box-shadow:0 2px 8px rgba(15,41,66,.08)}
.cards canvas{margin-bottom:10px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;border-top:4px solid var(--navy)}
.kpi b{display:block;font-size:26px;color:var(--navy)}.kpi span{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase}
.kpi.ok{border-top-color:var(--ok)}.kpi.w{border-top-color:var(--yellow)}.kpi.x{border-top-color:var(--bad)}
@media(max-width:600px){.kpis{grid-template-columns:repeat(2,1fr)}}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;color:var(--muted);padding:8px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid #eef1f5;vertical-align:middle}
.tw{overflow-x:auto}
.badge{display:inline-block;padding:3px 9px;border-radius:12px;font-size:12px;font-weight:800;white-space:nowrap}
.b-ok{background:#e3f4ea;color:var(--ok)}.b-w{background:#fff4d6;color:#8a6200}.b-x{background:#fbe9e7;color:var(--bad)}.b-n{background:#e9edf2;color:var(--muted)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.note{font-size:13px;color:var(--muted);line-height:1.45}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:24px;font-weight:600;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none;border:2px solid var(--yellow);max-width:90vw;text-align:center}
.toast.on{opacity:1}
.modal{position:fixed;inset:0;background:rgba(15,41,66,.55);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:24px 12px}
.modal.on{display:flex}
.modal .card{max-width:560px;width:100%}
.photo{width:96px;height:120px;border-radius:8px;border:1px solid var(--line);background:#e9edf2;object-fit:cover;display:block}
.logos{display:flex;gap:10px;flex-wrap:wrap}
.logo-t{border:2px solid var(--line);border-radius:8px;padding:6px;width:150px;text-align:center;font-size:12px;background:#fff}
.logo-t img{max-width:100%;height:60px;object-fit:contain;display:block;margin:0 auto 4px}
.logo-t.on{border-color:var(--orange)}
.empty{padding:20px;text-align:center;color:var(--muted)}
.dlayout{display:grid;gap:20px;grid-template-columns:1fr}
@media(min-width:1000px){.dlayout{grid-template-columns:1.25fr 1fr}.dprev{position:sticky;top:130px;align-self:start}}
.dprev canvas{width:100%;height:auto;border:1px solid var(--line);border-radius:6px;margin-bottom:10px;background:#fff}
.card h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--orange);margin:18px 0 8px;border-bottom:1px solid var(--line);padding-bottom:4px}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}
.chk{display:flex;align-items:center;gap:8px;text-transform:none;font-size:14px;font-weight:600;color:#1c2733;letter-spacing:0;background:#f7f9fb;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:0}
.chk input{width:20px;height:20px;flex:none;margin:0}
.sw{width:56px;height:44px;padding:2px;flex:none}
.camwrap{position:relative;width:100%;max-width:360px;aspect-ratio:4/5;margin:0 auto;background:#000;border-radius:12px;overflow:hidden}
.camwrap video{width:100%;height:100%;object-fit:cover;display:block}
.camwrap video.mirror{transform:scaleX(-1)}
.camguide{position:absolute;left:18%;right:18%;top:12%;bottom:22%;border:3px dashed rgba(242,183,5,.9);border-radius:50% 50% 45% 45%;pointer-events:none}
.vres{margin-top:10px;padding:12px;border-radius:8px;display:none}
</style>
</head>
<body>
<header><div class="hrow">
  <div class="hlogo">EHS</div>
  <div class="htitle"><h1 data-i="appTitle"></h1><div data-i="appSub"></div></div>
  <button class="langbtn" id="langBtn">ES</button>
</div></header>
<nav><div class="in">
  <button data-tab="issue" class="on" data-i="tabIssue"></button>
  <button data-tab="registry" data-i="tabRegistry"></button>
  <button data-tab="trainees" data-i="tabTrainees"></button>
  <button data-tab="trainings" data-i="tabTrainings"></button>
  <button data-tab="settings" data-i="tabSettings"></button>
</div></nav>
<main>

<!-- ISSUE -->
<section class="tab on" id="t-issue">
  <div class="card">
    <h2 data-i="secTraining"></h2>
    <div class="grid">
      <div><label data-i="training"></label><select id="iTraining"></select></div>
      <div><label data-i="dateCompleted"></label><input type="date" id="iDate"></div>
      <div><label data-i="facility"></label><select id="iFacility"></select></div>
      <div><label data-i="hours"></label><input id="iHours" inputmode="decimal" placeholder="2.0"></div>
      <div><label data-i="score"></label><input id="iScore" data-ph="scorePh"></div>
      <div><label data-i="certLang"></label><select id="iLang">
        <option value="en" data-i="langEN"></option><option value="es" data-i="langES"></option><option value="bi" data-i="langBI"></option></select></div>
      <div><label data-i="logo"></label><select id="iLogo"></select></div>
      <div><label data-i="expiresCalc"></label><input id="iExp" readonly></div>
    </div>
  </div>
  <div class="card">
    <h2 data-i="secTrainer"></h2>
    <div class="grid">
      <div><label data-i="trainer"></label><input id="iTrainer" list="trainerList" autocomplete="off"><datalist id="trainerList"></datalist></div>
    </div>
    <div class="mt"><label data-i="trainerSig"></label><canvas class="sig" id="sigTrainer"></canvas>
      <div class="row mt"><button class="btn g sm" data-clear="sigTrainer" data-i="clear"></button><span class="note" data-i="sigNote"></span></div></div>
  </div>
  <div class="card">
    <h2 data-i="selectTrainees"></h2>
    <div class="row"><input id="iSearch" data-ph="search" style="flex:1;min-width:180px"><button class="btn y" id="iAddTrainee" data-i="addTrainee"></button><button class="btn g sm" id="iAll" data-i="selAll"></button></div>
    <div class="tlist mt" id="iList"></div>
    <div class="row mt"><button class="btn o" id="iGenerate" data-i="generate"></button><span class="note" id="iSelCount"></span></div>
  </div>
  <div class="card" id="previewCard" style="display:none">
    <h2 data-i="preview"></h2>
    <div class="row" style="margin-bottom:12px"><select id="pPick" style="max-width:420px"></select></div>
    <div class="prev">
      <div><canvas id="cvCert"></canvas></div>
      <div class="cards"><canvas id="cvFront"></canvas><canvas id="cvBack"></canvas></div>
    </div>
    <div class="row mt">
      <button class="btn" id="dlCerts" data-i="dlCerts"></button>
      <button class="btn o" id="dlSheet" data-i="dlSheet"></button>
      <button class="btn y" id="dlWallet" data-i="dlWallet"></button>
      <button class="btn g" id="dlPng" data-i="dlPng"></button>
      <button class="btn g" id="shareBtn" data-i="share"></button>
    </div>
    <p class="note" data-i="sheetNote"></p>
  </div>
</section>

<!-- REGISTRY -->
<section class="tab" id="t-registry">
  <div class="kpis">
    <div class="kpi"><b id="kTotal">0</b><span data-i="total"></span></div>
    <div class="kpi ok"><b id="kValid">0</b><span data-i="valid"></span></div>
    <div class="kpi w"><b id="kExpiring">0</b><span data-i="expiring30"></span></div>
    <div class="kpi x"><b id="kExpired">0</b><span data-i="expired"></span></div>
  </div>
  <div class="card">
    <h2 data-i="verify"></h2>
    <div class="row"><input id="vNo" data-ph="verifyPh" style="flex:1;min-width:200px" autocapitalize="characters"><button class="btn" id="vBtn" data-i="verifyBtn"></button></div>
    <div class="vres" id="vRes"></div>
  </div>
  <div class="card">
    <h2 data-i="tabRegistry"></h2>
    <div class="grid">
      <div><input id="rSearch" data-ph="search"></div>
      <div><select id="rStatus"><option value="" data-i="allStatus"></option><option value="valid" data-i="valid"></option><option value="expiring" data-i="expiring30"></option><option value="expired" data-i="expired"></option></select></div>
      <div><select id="rFac"></select></div>
    </div>
    <div class="tw mt"><table><thead><tr><th data-i="certNo"></th><th data-i="name"></th><th data-i="training"></th><th data-i="issued"></th><th data-i="expires"></th><th data-i="status"></th><th></th></tr></thead><tbody id="rBody"></tbody></table></div>
    <div class="row mt">
      <button class="btn g" id="rCsv" data-i="exportCSV"></button>
      <button class="btn g" id="rBackup" data-i="backup"></button>
      <button class="btn g" id="rRestore" data-i="restore"></button>
      <input type="file" id="rFile" accept=".json,application/json" hidden>
    </div>
  </div>
</section>

<!-- TRAINEES -->
<section class="tab" id="t-trainees">
  <div class="card">
    <h2 data-i="tabTrainees"></h2>
    <div class="row"><input id="eSearch" data-ph="search" style="flex:1;min-width:180px"><button class="btn y" id="eAdd" data-i="addTrainee"></button><button class="btn g" id="eImport" data-i="importCSV"></button><input type="file" id="eFile" accept=".csv,text/csv" hidden></div>
    <p class="note" data-i="csvNote"></p>
    <div class="tw"><table><thead><tr><th></th><th data-i="name"></th><th data-i="empId"></th><th data-i="facility"></th><th data-i="agency"></th><th data-i="active"></th><th></th></tr></thead><tbody id="eBody"></tbody></table></div>
  </div>
</section>

<!-- TRAININGS -->
<section class="tab" id="t-trainings">
  <div class="card">
    <h2 data-i="tabTrainings"></h2>
    <p class="note" data-i="trainNote"></p>
    <div class="row"><button class="btn y" id="cAdd" data-i="addTraining"></button></div>
    <div class="tw mt"><table><thead><tr><th data-i="nameEN"></th><th data-i="nameES"></th><th data-i="citation"></th><th data-i="validity"></th><th></th></tr></thead><tbody id="cBody"></tbody></table></div>
  </div>
</section>

<!-- SETTINGS -->
<section class="tab" id="t-settings">
  <div class="card">
    <h2 data-i="secOrg"></h2>
    <div class="grid">
      <div><label data-i="orgName"></label><input id="sOrg"></div>
      <div><label data-i="deptLine"></label><input id="sDept"></div>
      <div><label data-i="approverName"></label><input id="sApName"></div>
      <div><label data-i="approverTitle"></label><input id="sApTitle"></div>
    </div>
    <div class="mt"><label data-i="approverSig"></label><canvas class="sig" id="sigApprover"></canvas>
      <div class="row mt"><button class="btn g sm" data-clear="sigApprover" data-i="clear"></button></div></div>
    <div class="mt"><label data-i="facilities"></label><textarea id="sFac"></textarea><p class="note" data-i="facNote"></p></div>
    <div class="mt"><label data-i="agencies"></label><input id="sAg"></div>
    <div class="row mt"><button class="btn o" id="sSave" data-i="save"></button></div>
  </div>
  <div class="card" id="designCard">
    <h2 data-i="secDesign"></h2>
    <div class="dlayout">
      <div>
        <h3 data-i="hLook"></h3>
        <div class="grid">
          <div><label data-i="dTheme"></label><select id="dTheme"></select></div>
          <div><label data-i="dColors"></label><div class="row"><input type="color" data-d="c1" class="sw"><input type="color" data-d="c2" class="sw"><input type="color" data-d="c3" class="sw"></div></div>
          <div><label data-i="dStyle"></label><select data-d="style"><option value="classic" data-i="stClassic"></option><option value="modern" data-i="stModern"></option><option value="minimal" data-i="stMinimal"></option></select></div>
          <div><label data-i="dFont"></label><select data-d="nameFont"><option value="serif" data-i="fSerif"></option><option value="sans" data-i="fSans"></option><option value="script" data-i="fScript"></option></select></div>
        </div>
        <h3 data-i="hText"></h3>
        <div class="grid">
          <div><label data-i="dTitleEN"></label><input data-d="titleEN" list="titlesEN"><datalist id="titlesEN"><option value="CERTIFICATE OF COMPLETION"><option value="CERTIFICATE OF TRAINING"><option value="CERTIFICATE OF ACHIEVEMENT"><option value="CERTIFICATE OF QUALIFICATION"><option value="OPERATOR CERTIFICATION"><option value="CERTIFICATE OF ATTENDANCE"></datalist></div>
          <div><label data-i="dTitleES"></label><input data-d="titleES" list="titlesES"><datalist id="titlesES"><option value="CERTIFICADO DE FINALIZACIÓN"><option value="CERTIFICADO DE CAPACITACIÓN"><option value="CERTIFICADO DE LOGRO"><option value="CERTIFICADO DE CALIFICACIÓN"><option value="CERTIFICACIÓN DE OPERADOR"><option value="CONSTANCIA DE ASISTENCIA"></datalist></div>
          <div><label data-i="dSeal"></label><input data-d="sealText" maxlength="6"></div>
          <div><label data-i="dStmtEN"></label><input data-d="statementEN" data-ph="stmtPh"></div>
          <div><label data-i="dStmtES"></label><input data-d="statementES"></div>
        </div>
        <h3 data-i="hShowCert"></h3>
        <div class="checks" id="dChecksCert"></div>
        <h3 data-i="hCard"></h3>
        <div class="checks" id="dChecksCard"></div>
        <div class="grid mt">
          <div><label data-i="dBackEN"></label><textarea data-d="cardBackEN" data-ph="backPh" style="min-height:70px"></textarea></div>
          <div><label data-i="dBackES"></label><textarea data-d="cardBackES" style="min-height:70px"></textarea></div>
          <div><label data-i="dReturn"></label><input data-d="cardReturn" data-ph="returnPh"></div>
        </div>
        <p class="note" data-i="tokNote"></p>
        <h3 data-i="hPrint"></h3>
        <div class="grid">
          <div><label data-i="dCrop"></label><select data-d="cropStyle"><option value="dashed" data-i="cropDashed"></option><option value="corners" data-i="cropCorners"></option><option value="none" data-i="cropNone"></option></select></div>
          <div class="checks" id="dChecksPrint"></div>
        </div>
        <h3 data-i="hNumbers"></h3>
        <div class="grid">
          <div><label data-i="dFormat"></label><input data-d="certFormat" list="fmts" class="mono"><datalist id="fmts"><option value="{SITE}-{MM}{DD}{YY}{H}{mm}"><option value="{SITE}-{YYYY}-{SEQ}"><option value="{SITE}{YY}{SEQ}"><option value="{SITE}-{EMP}-{MM}{DD}{YY}"><option value="GPG-{SITE}-{YYYY}{MM}{DD}-{SEQ}"></datalist></div>
          <div><label data-i="dSeq"></label><input data-d="seq" type="number" min="1" inputmode="numeric"></div>
          <div><label data-i="dExample"></label><input id="dExample" readonly class="mono"></div>
        </div>
        <p class="note" data-i="fmtNote"></p>
        <div class="checks" id="dChecksNum"></div>
        <h3 data-i="hDates"></h3>
        <div class="grid">
          <div><label data-i="dDateFmt"></label><select data-d="dateFmt"><option value="long" data-i="dfLong"></option><option value="us">MM/DD/YYYY</option><option value="intl">DD/MM/YYYY</option><option value="iso">YYYY-MM-DD</option></select></div>
          <div><label data-i="dWarn"></label><input data-d="warnDays" type="number" min="1" max="365" inputmode="numeric"></div>
        </div>
        <div class="row mt"><button class="btn o" id="dSave" data-i="save"></button><button class="btn g" id="dReset" data-i="resetDesign"></button></div>
      </div>
      <div class="dprev">
        <label data-i="livePrev"></label>
        <select id="dPrevLang" style="margin-bottom:8px"><option value="en" data-i="langEN"></option><option value="es" data-i="langES"></option><option value="bi" data-i="langBI"></option></select>
        <canvas id="dPrevCert"></canvas>
        <canvas id="dPrevFront"></canvas>
        <canvas id="dPrevBack"></canvas>
      </div>
    </div>
  </div>
  <div class="card">
    <h2 data-i="logo"></h2>
    <p class="note" data-i="logoNote"></p>
    <div class="logos" id="sLogos"></div>
    <div class="row mt"><input id="sLogoName" data-ph="logoNamePh" style="max-width:240px"><button class="btn y" id="sLogoUp" data-i="uploadLogo"></button><input type="file" id="sLogoFile" accept="image/*" hidden></div>
  </div>
  <div class="card">
    <h2 data-i="dataTitle"></h2>
    <p class="note" id="sStorage"></p>
    <div class="row"><button class="btn r" id="sWipe" data-i="clearAll"></button></div>
  </div>
</section>
</main>

<!-- Trainee modal -->
<div class="modal" id="mTrainee"><div class="card">
  <h2 data-i="traineeTitle"></h2>
  <div class="row" style="align-items:flex-start;gap:14px">
    <img class="photo" id="mPhoto" alt="">
    <div style="flex:1;min-width:180px">
      <div class="row"><button class="btn g sm" id="mTake" data-i="takePhoto"></button><button class="btn g sm" id="mChoose" data-i="choosePhoto"></button><button class="btn r sm" id="mNoPhoto" data-i="removePhoto"></button></div>
      <input type="file" id="mCam" accept="image/*" capture="environment" hidden><input type="file" id="mLib" accept="image/*" hidden>
      <p class="note" data-i="photoNote"></p>
    </div>
  </div>
  <div class="grid mt">
    <div><label data-i="name"></label><input id="mName"></div>
    <div><label data-i="empId"></label><input id="mEmp"></div>
    <div><label data-i="dept"></label><input id="mDept"></div>
    <div><label data-i="facility"></label><select id="mFac"></select></div>
    <div><label data-i="agency"></label><select id="mAg"></select></div>

/* ---------------- dates (no timezone shifting) ---------------- */
function pd(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?{y:+m[1],m:+m[2],d:+m[3]}:null}
function iso(o){return o.y+'-'+String(o.m).padStart(2,'0')+'-'+String(o.d).padStart(2,'0')}
function todayISO(){var n=new Date();return iso({y:n.getFullYear(),m:n.getMonth()+1,d:n.getDate()})}
function addMonths(s,mo){var o=pd(s);if(!o||!mo)return '';var m0=o.m-1+mo,y=o.y+Math.floor(m0/12),m=(m0%12)+1;var dim=new Date(y,m,0).getDate();return iso({y:y,m:m,d:Math.min(o.d,dim)})}
function us(s){var o=pd(s);return o?String(o.m).padStart(2,'0')+'/'+String(o.d).padStart(2,'0')+'/'+o.y:''}
var MON={en:['January','February','March','April','May','June','July','August','September','October','November','December'],es:['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre']};
function longDate(s,l){var o=pd(s);if(!o)return '';return l==='es'?o.d+' de '+MON.es[o.m-1]+' de '+o.y:MON.en[o.m-1]+' '+o.d+', '+o.y}
function daysUntil(s){var o=pd(s);if(!o)return Infinity;var a=new Date(o.y,o.m-1,o.d),n=new Date();n=new Date(n.getFullYear(),n.getMonth(),n.getDate());return Math.round((a-n)/864e5)}
function status(r){if(!r.expires)return 'none';var d=daysUntil(r.expires);return d<0?'expired':d<=(D().warnDays||30)?'expiring':'valid'}
function badge(r){var s=status(r);var map={valid:['b-ok','valid'],expiring:['b-w','expiring30'],expired:['b-x','expired'],none:['b-n','noExp']};return '<span class="badge '+map[s][0]+'">'+esc(s==='expiring'?(lang==='es'?'Por vencer':'Expiring'):t(map[s][1]))+'</span>'}

/* ---------------- signature pads ---------------- */
function SigPad(cv){var ctx,drawing=false,dirty=false,self=this;

 function pos(e){var r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*2,y:(e.clientY-r.top)*2}}
 cv.addEventListener('pointerdown',function(e){if(!ctx)size();drawing=true;dirty=true;var p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);cv.setPointerCapture(e.pointerId);e.preventDefault()});
 cv.addEventListener('pointermove',function(e){if(!drawing)return;var p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault()});
 ['pointerup','pointercancel'].forEach(function(ev){cv.addEventListener(ev,function(){if(drawing){drawing=false;if(self.onchange)self.onchange()}})});
 this.size=size;
 this.clear=function(){if(!ctx)size();if(ctx)ctx.clearRect(0,0,cv.width,cv.height);dirty=false};
 this.isEmpty=function(){return !dirty};
 this.get=function(){if(!dirty)return '';/* trim */var c=document.createElement('canvas');c.width=cv.width;c.height=cv.height;var x=c.getContext('2d');x.drawImage(cv,0,0);return trimCanvas(c).toDataURL('image/png')};
 this.set=function(src){this.clear();if(!src)return;var i=new Image();i.onload=function(){if(!ctx)size();if(!ctx)return;var s=Math.min(cv.width*.9/i.width,cv.height*.85/i.height,1);var w=i.width*s,h=i.height*s;ctx.drawImage(i,(cv.width-w)/2,(cv.height-h)/2,w,h);dirty=true};i.src=src};
 window.addEventListener('resize',size);
}
function trimCanvas(c){var x=c.getContext('2d'),d=x.getImageData(0,0,c.width,c.height).data,w=c.width,h=c.height,t0=h,l=w,r=0,b=0;
 for(var y=0;y<h;y+=2)for(var xx=0;xx<w;xx+=2){if(d[(y*w+xx)*4+3]>20){if(y<t0)t0=y;if(y>b)b=y;if(xx<l)l=xx;if(xx>r)r=xx}}
 if(r<=l||b<=t0)return c;var p=8;l=Math.max(0,l-p);t0=Math.max(0,t0-p);r=Math.min(w,r+p);b=Math.min(h,b+p);
 var o=document.createElement('canvas');o.width=r-l;o.height=b-t0;o.getContext('2d').drawImage(c,l,t0,r-l,b-t0,0,0,r-l,b-t0);
 if(o.width>700){var s=700/o.width,o2=document.createElement('canvas');o2.width=700;o2.height=Math.round(o.height*s);o2.getContext('2d').drawImage(o,0,0,o2.width,o2.height);return o2}return o}

/* ---------------- minimal PDF writer (JPEG pages, no libraries) ---------------- */
function b64bytes(d){var s=atob(d.split(',')[1]),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
function buildPDF(pages,title){var enc=new TextEncoder(),chunks=[],len=0,offs=[];
 function push(d){var b=typeof d==='string'?enc.encode(d):d;chunks.push(b);len+=b.length}
 push('%PDF-1.4\n');push(new Uint8Array([37,226,227,207,211,10]));
 function obj(id,f){offs[id]=len;push(id+' 0 obj\n');f();push('\nendobj\n')}
 var n=pages.length,total=4+3*n;
 obj(1,function(){push('<< /Type /Catalog /Pages 2 0 R >>')});
 obj(2,function(){push('<< /Type /Pages /Kids ['+pages.map(function(p,i){return(4+3*i)+' 0 R'}).join(' ')+'] /Count '+n+' >>')});
 obj(3,function(){push('<< /Title ('+String(title||'Certificates').replace(/[()\\]/g,'').replace(/[^\x20-\x7e]/g,'')+') /Producer (EHS Certificate Generator) >>')});
 pages.forEach(function(p,i){var pid=4+3*i,cid=pid+1,iid=pid+2,jpg=b64bytes(p.data);
  obj(pid,function(){push('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+p.w+' '+p.h+'] /Resources << /XObject << /Im0 '+iid+' 0 R >> >> /Contents '+cid+' 0 R >>')});
  var cs='q '+p.w+' 0 0 '+p.h+' 0 0 cm /Im0 Do Q';obj(cid,function(){push('<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream')});
  obj(iid,function(){push('<< /Type /XObject /Subtype /Image /Width '+p.iw+' /Height '+p.ih+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpg.length+' >>\nstream\n');push(jpg);push('\nendstream')})});
 var xref=len,s='xref\n0 '+total+'\n0000000000 65535 f \n';for(var k=1;k<total;k++)s+=String(offs[k]).padStart(10,'0')+' 00000 n \n';
 push(s+'trailer\n<< /Size '+total+' /Root 1 0 R /Info 3 0 R >>\nstartxref\n'+xref+'\n%%EOF');
 return new Blob(chunks,{type:'application/pdf'})}
function page(c,w,h,q){return{data:c.toDataURL('image/jpeg',q||.92),iw:c.width,ih:c.height,w:w,h:h}}
var dlNS=null;try{if(window.claude&&claude.use)claude.use('downloads').then(function(ns){dlNS=ns}).catch(function(){})}catch(e){}
function download(blob,name){if(dlNS){dlNS.save({filename:name,data:blob}).then(function(r){if(r&&r.status==='saved')toast('✓ '+name)}).catch(function(e){if(e&&e.code!=='declined')toast('⚠ '+(e.message||e.code))});return}
 var u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){a.remove();URL.revokeObjectURL(u)},4000)}
function fname(s){return String(s).replace(/[^\w\-]+/g,'_').replace(/_+/g,'_').slice(0,60)}
function seq(list,fn){var out=[];return list.reduce(function(p,it){return p.then(function(){return fn(it).then(function(v){out.push(v)})})},Promise.resolve()).then(function(){return out})}

function sheetPDF(fronts,backs){/* letter portrait, 200dpi; 8 cards; backs mirrored for long-edge duplex */
 var W=1700,H=2200,cw=675,ch=425,gx=40,gy=40,mx=(W-2*cw-gx)/2,my=(H-4*ch-3*gy)/2,pages=[],cs=D().cropStyle;
 function sheet(imgs,mirror){var c=document.createElement('canvas');c.width=W;c.height=H;var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);
  imgs.forEach(function(im,i){var col=i%2,row=Math.floor(i/2);if(mirror)col=1-col;var px=mx+col*(cw+gx),py=my+row*(ch+gy);x.drawImage(im,px,py,cw,ch);
   x.strokeStyle='#9aa7b4';x.lineWidth=1.5;
   if(cs==='dashed'){x.setLineDash([8,6]);x.strokeRect(px-.5,py-.5,cw+1,ch+1);x.setLineDash([])}
   else if(cs==='corners'){var L2=18,o=6;[[px,py,-1,-1],[px+cw,py,1,-1],[px,py+ch,-1,1],[px+cw,py+ch,1,1]].forEach(function(k){x.beginPath();x.moveTo(k[0]+k[2]*o,k[1]);x.lineTo(k[0]+k[2]*(o+L2),k[1]);x.moveTo(k[0],k[1]+k[3]*o);x.lineTo(k[0],k[1]+k[3]*(o+L2));x.stroke()})}});
  x.fillStyle='#9aa7b4';x.font=F('normal',22,SANS);x.fillText(mirror?'BACKS / REVERSOS — print 100%':'FRONTS / FRENTES — print 100% (Actual size)',mx,my-14);return c}
 for(var i=0;i<fronts.length;i+=8){pages.push(page(sheet(fronts.slice(i,i+8),false),612,792,.9));if(D().sheetBacks)pages.push(page(sheet(backs.slice(i,i+8),true),612,792,.9))}
 return buildPDF(pages,'ID Card Sheet')}
